# =============================================================================
# Squid Config - STRICT Allowlist for this pod
# =============================================================================
# WARNING: This configuration blocks ALL traffic except explicitly listed
# domains below. Add only the domains this pod absolutely requires.
#
# Current allowlist includes:
# - NPM registry (for extensions)
# - OS security updates
# =============================================================================

visible_hostname contained-proxy
http_port 3128
coredump_dir /var/spool/squid

# ============================================================
# ALLOWED DOMAINS - AS EXAMPLE, APT Repos, Zed Editor, NPM, Z.ai GLM Subscription,
# =============================================================================

# OS security updates (minimal)
acl allowed dstdomain .security.ubuntu.com
acl allowed dstdomain .archive.ubuntu.com

# NPM
acl allowed dstdomain .npmjs.com
acl allowed dstdomain .registry.npmjs.org

# Zed Editor
acl allowed dstdomain .zed.dev
acl allowed dstdomain release.zed.dev

# GLM Code Subscription
# acl allowed dstdomain api.z.ai

## Git repositories (for project code)
#acl allowed dstdomain .github.com
#acl allowed dstdomain .gitlab.com

# browser-agent downloading chrome
#acl allowed dstdomain .googlechromelabs.github.io
#acl allowed dstdomain .storage.googleapis.com

#Python pip pypy servers
#acl allowed dstdomain .pypi.python.org
#acl allowed dstdomain .pypi.org
#acl allowed dstdomain .pythonhosted.org
#acl allowed dstdomain .files.pythonhosted.org

# Add custom domains below if needed:
# acl allowed dstdomain .yourdomain.com

# Internal allowed destinations (specific IPs)
# These allow proxy access to specific local servers (e.g., local dev servers)
# Example: Allow access to local dev server at 192.168.0.1:8080
# acl allowed_internal dst 192.168.0.1
# acl allowed_internal_port port 8080

# Internal Dockers allowed destinations (specific IPs)
# These allow proxy access to specific local servers (e.g., local dev servers)
# acl allowed_dockers dst 172.25.0.2
# acl allowed_dockers_port port 40002

# ============================================================
# BLOCKED: Private/Local Networks
# ============================================================
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16

# ============================================================
# PORTS
# ============================================================
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# ============================================================
# ACCESS RULES - DENY BY DEFAULT
# ============================================================

# Allow only listed domains on safe ports
http_access allow allowed Safe_ports
http_access allow allowed SSL_ports CONNECT

# Allow specific internal destinations (configured above)
http_access allow allowed_internal allowed_internal_port
http_access allow allowed_dockers allowed_dockers_port

# Deny private networks
http_access deny localnet

# Deny unsafe ports
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# BLOCK EVERYTHING ELSE
http_access deny all

# ============================================================
# LOGGING - All requests logged for audit
# ============================================================
access_log /var/log/squid/access.log squid

# Minimal cache (proxy-only mode)
cache_mem 8 MB
cache_dir ufs /var/spool/squid 50 16 128
