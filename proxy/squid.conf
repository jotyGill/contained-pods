# Squid Proxy Configuration - Allowlist Based Access Control
# ============================================================
# IMPORTANT: This is an allowlist-based proxy. ONLY explicitly allowed
# domains and destinations can be accessed. Everything else is blocked.
#
# To add allowed domains, add lines like:
#   acl allowed_external dstdomain .example.com
#   acl allowed_external dstdomain api.example.com

# Visible hostname
visible_hostname squid-proxy

# Port configuration
http_port 3128
coredump_dir /var/spool/squid

# ============================================================
# ACL DEFINITIONS - ALLOWLIST ONLY
# ============================================================

# External allowed sites (HTTP/HTTPS)
# Add your allowed domains below
acl allowed_external dstdomain .api.z.ai
acl allowed_external dstdomain .archive.ubuntu.com
acl allowed_external dstdomain .security.ubuntu.com
acl allowed_external dstdomain .ubuntu.com
acl allowed_external dstdomain .debian.org
acl allowed_external dstdomain .github.com
acl allowed_external dstdomain .npmjs.com
acl allowed_external dstdomain .pypi.org
acl allowed_external dstdomain .yarnpkg.com

# Internal allowed destinations (specific IPs)
# These allow proxy access to specific local servers (e.g., local dev servers)
# Example: Allow access to local dev server at 192.168.0.70:8082
acl allowed_internal dst 192.168.0.70
acl allowed_internal_port port 8082

# Private/Local network ranges (blocked except allowlist above)
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src 127.0.0.0/8

# Standard ports
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 22
acl Safe_ports port 8080
acl CONNECT method CONNECT

# ============================================================
# ACCESS RULES - ORDER MATTERS!
# ============================================================

# 1. Allow external allowlist sites
http_access allow allowed_external Safe_ports
http_access allow allowed_external SSL_ports CONNECT

# 2. Allow specific internal destinations (configured above)
http_access allow allowed_internal allowed_internal_port

# 3. Deny ALL other local/private network access
http_access deny localnet

# 4. Deny unsafe ports
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# 5. Deny everything else by default
http_access deny all

# ============================================================
# LOGGING
# ============================================================
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# ============================================================
# CACHE SETTINGS (minimal for proxy-only use)
# ============================================================
cache_mem 8 MB
maximum_object_size_in_memory 4 MB
cache_dir ufs /var/spool/squid 50 16 128
