<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Squid &amp; Dnsmasq Log Viewer</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3340;
    --txt:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
    --ok:#3fb950; --block:#f85149; --cache:#d29922; --other:#8957e5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  header{padding:1rem 1.4rem;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  header h1{font-size:1.1rem;margin:0;font-weight:600;letter-spacing:.3px}
  .chooser{display:flex;gap:.4rem;align-items:center;font-size:.82rem;color:var(--muted);margin-left:auto}
  .chooser select{min-width:220px}
  .wrap{padding:1.2rem 1.4rem;display:grid;gap:1.1rem;
        grid-template-columns:repeat(12,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:1rem 1.1rem}
  .card h2{margin:.1rem 0 .8rem;font-size:.82rem;color:var(--muted);
           text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .kpis{grid-column:span 12;display:grid;grid-template-columns:repeat(6,1fr);gap:.8rem}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;
       padding:.9rem 1rem}
  .kpi .v{font-size:1.7rem;font-weight:700}
  .kpi .l{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px}
  .row{grid-column:span 12;display:flex;gap:1.1rem}
  .c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c12{grid-column:span 12}
  .legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:.4rem}
  .dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-right:.35rem;vertical-align:middle}
  svg{width:100%;height:auto;display:block}
  .bar{transition:.15s}.bar:hover{opacity:.8}
  .controls{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.7rem}
  select,input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
        border-radius:8px;padding:.4rem .6rem;font-size:.85rem}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  th,td{padding:.45rem .55rem;border-bottom:1px solid var(--line);text-align:left}
  th{cursor:pointer;color:var(--muted);position:sticky;top:0;background:var(--panel)}
  td.url{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-size:.68rem;padding:.1rem .5rem;border-radius:999px;font-weight:600}
  .pill.block{background:rgba(248,81,73,.15);color:var(--block)}
  .pill.through{background:rgba(63,185,80,.15);color:var(--ok)}
  .pill.cache{background:rgba(210,153,34,.15);color:var(--cache)}
  .pill.other{background:rgba(137,87,229,.15);color:var(--other)}
  .tbl-wrap{max-height:500px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  /* unique-requests: scroll only once it exceeds ~12 entries (~32px row height + header) */
  .uniq-wrap{max-height:calc(2.37rem + 12 * 2.13rem)}
  .empty{grid-column:span 12;min-height:70vh;display:flex;align-items:center;justify-content:center}
  .empty-card{max-width:640px;padding:2.4rem 2.6rem;border:1px dashed var(--line);
    border-radius:16px;background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    text-align:center;box-shadow:0 8px 30px #0006;transition:.2s}
  .empty-card:hover{border-color:var(--accent)}
  .empty-card .ico{font-size:3.2rem;line-height:1;margin-bottom:.6rem}
  .empty-card h2{margin:.2rem 0 .5rem;font-size:1.15rem;font-weight:600}
  .empty-card p{margin:.35rem 0;color:var(--muted);font-size:.9rem;line-height:1.5}

  .axis{stroke:var(--line);stroke-width:1}
  .axlab{fill:var(--muted);font-size:11px}
  .tip{position:fixed;pointer-events:none;background:#000a;border:1px solid var(--line);
       padding:.35rem .55rem;border-radius:6px;font-size:.75rem;opacity:0;z-index:9}
  footer{grid-column:span 12;color:var(--muted);font-size:.75rem;text-align:center;padding-bottom:1rem}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}
    .c2,.c3,.c4,.c5,.c6,.c7,.c12{grid-column:span 12}}
</style>
</head>
<body>
<header>
  <h1>🦑 Squid &amp; Dnsmasq Log Viewer</h1>
  <span class="legend" style="margin:0">
    <span><span class="dot" style="background:var(--block)"></span>Blocked</span>
    <span><span class="dot" style="background:var(--ok)"></span>Through</span>
    <span><span class="dot" style="background:var(--cache)"></span>Cache hit</span>
    <span><span class="dot" style="background:var(--other)"></span>Other</span>
  </span>

  <span class="chooser" id="chooser">
    <label for="containerSelect">Container</label>
    <select id="containerSelect">
      <option value="">Discovering…</option>
    </select>
  </span>
</header>

<div class="wrap" id="app">
  <div class="empty" id="empty">
    <div class="empty-card">
      <div class="ico">🦑</div>
      <h2>Squid &amp; Dnsmasq Log Viewer</h2>
      <p>Select a pod from the dropdown above to view its logs.</p>
    </div>
  </div>
</div>

<div class="wrap" id="dnsApp" style="padding-top:0"></div>

<div class="tip" id="tip"></div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const COL={block:'#f85149',through:'#3fb950',cache:'#d29922',other:'#8957e5'};

// escape text and attribute values before inserting into innerHTML
function esc(v){return String(v).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function classify(sc){
  if(sc==='TCP_DENIED'||sc==='TCP_DENIED_ABORTED') return 'block';
  if(sc==='TCP_HIT'||sc==='TCP_MEM_HIT'||sc==='TCP_IMS_HIT') return 'cache';
  if(sc&&sc.startsWith('TCP_')) return 'through';
  return 'other';
}
function domain(u){const m=/https?:\/\/([^/]+)/.exec(u||'');return m?m[1]:u;}

function parse(text){
  const rows=[];
  text.split(/\r?\n/).forEach(l=>{
    if(!l.trim())return;
    const f=l.split(/\t| +/); // split on tabs or spaces
    if(f.length<7)return;
    const ts=parseFloat(f[0]); if(isNaN(ts))return;
    const [sc,hc]=f[3].split('/');
    rows.push({
      ts, dur:+f[1]||0, client:f[2],
      sc, hc:hc||'', size:+f[4]||0, method:f[5],
      url:f[6], domain:domain(f[6]), user:f[7]||'-', mime:f[8]||'-',
      outcome:classify(sc)
    });
  });
  rows.sort((a,b)=>a.ts-b.ts);
  return rows;
}

function fmtTime(t){
  const d=new Date(t*1000);
  const pad=n=>String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${d.toLocaleString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
}
function fmtBytes(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(1)+' MB';}

/* ---------- kpis ---------- */
function kpis(rows){
  const r={total:rows.length,block:0,through:0,cache:0,other:0,urls:new Set(),clients:new Set()};
  rows.forEach(x=>{r[x.outcome]++;r.urls.add(x.domain);r.clients.add(x.client);});
  return r;
}

/* ---------- top urls ---------- */
function topUrls(rows,sel){
  const m={};
  rows.forEach(r=>{const d=m[r.domain]||(m[r.domain]={through:0,block:0,cache:0});
    d[r.outcome]++;});
  const arr=Object.entries(m).map(([k,v])=>({k,...v,tot:v.through+v.block+v.cache}))
    .sort((a,b)=>b.tot-a.tot).slice(0,12);
  const max=Math.max(1,...arr.map(a=>a.tot));
  const W=380;
  const bars=arr.map(a=>{
    const wT=a.through/max*W, wB=a.block/max*W, wC=a.cache/max*W;
    return `<div style="margin:.25rem 0">
      <div style="font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.k)}</div>
      <div style="display:flex;height:14px;border-radius:4px;overflow:hidden;background:#0d1117">
        <div style="width:${wT}px;background:${COL.through}"></div>
        <div style="width:${wB}px;background:${COL.block}"></div>
        <div style="width:${wC}px;background:${COL.cache}"></div>
      </div></div>`;
  }).join('');
  sel.innerHTML=bars||'<div class="empty">no data</div>';
}

/* ---------- table ---------- */
let TBL={rows:[],f:'',outcome:'all',sort:'ts',dir:-1};
function renderTable(){
  const {rows,f,outcome,sort,dir}=TBL;
  let r=rows.filter(x=>(outcome==='all'||x.outcome===outcome) &&
    (!f || (x.url+x.domain+x.client+x.sc).toLowerCase().includes(f.toLowerCase())));
  r=r.sort((a,b)=>{let av=a[sort],bv=b[sort];if(sort==='ts'){av=a.ts;bv=b.ts;}
    return (av>bv?1:av<bv?-1:0)*dir;});
  const pill=o=>`<span class="pill ${o}">${({block:'Blocked',through:'Through',cache:'Cache hit',other:'Other'})[o]||o}</span>`;
  const rowsHtml=r.slice(0,2000).map(x=>`<tr>
    <td>${fmtTime(x.ts)}</td><td>${esc(x.client)}</td>
    <td class="url" title="${esc(x.url)}">${esc(x.url)}</td>
    <td>${esc(x.method)}</td><td>${esc(x.sc)}/${esc(x.hc)}</td>
    <td>${fmtBytes(x.size)}</td><td>${pill(x.outcome)}</td></tr>`).join('');
  $('#tblBody').innerHTML=rowsHtml;
  $('#tblCount').textContent=r.length+` / ${rows.length}`;
  const note=$('#tblNote');
  if(note) note.textContent = r.length>2000
    ? '⚠ Showing first 2000 rows only — filter or sort to narrow results.'
    : '';
}
function buildTable(rows){
  TBL.rows=rows;
  const wrap=`<div class="tbl-wrap"><table>
    <thead><tr>
      <th data-s="ts">Time</th><th data-s="client">Client</th><th data-s="url">URL</th>
      <th data-s="method">Method</th><th data-s="sc">Squid/HTTP</th>
      <th data-s="size">Size</th><th>Outcome</th></tr></thead>
    <tbody id="tblBody"></tbody></table></div>`;
  $('#tableCard').innerHTML=wrap;
  document.querySelectorAll('#tableCard th[data-s]').forEach(th=>{
    th.onclick=()=>{const s=th.dataset.s;TBL.dir=TBL.sort===s?-TBL.dir:1;TBL.sort=s;renderTable();};
  });
  renderTable();
}

/* ---------- unique requests ---------- */
let UNIQ={rows:[],f:'',outcome:'all',sort:'last',dir:-1};
function buildUniq(rows){
  const m={};
  rows.forEach(r=>{
    const key=`${r.method}|${r.url}|${r.sc}/${r.hc}|${r.outcome}`;
    const e=m[key]||(m[key]={method:r.method,url:r.url,code:r.sc+'/'+r.hc,
      outcome:r.outcome,count:0,last:0});
    e.count++; if(r.ts>e.last) e.last=r.ts;
  });
   UNIQ.rows=Object.values(m);
   const wrap=`<div class="tbl-wrap uniq-wrap"><table>
    <thead><tr>
      <th data-s="method">Method</th><th data-s="url">Full request path</th>
      <th data-s="code">Squid/HTTP</th><th data-s="outcome">Outcome</th>
      <th data-s="count">Hits</th><th data-s="last">Last seen</th>
    </tr></thead><tbody id="uniqBody"></tbody></table></div>`;
  $('#uniqCard').innerHTML=wrap;
  document.querySelectorAll('#uniqCard th[data-s]').forEach(th=>{
    th.onclick=()=>{const s=th.dataset.s;UNIQ.dir=UNIQ.sort===s?-UNIQ.dir:1;UNIQ.sort=s;renderUniq();};
  });
  renderUniq();
}
function renderUniq(){
  const {rows,f,outcome,sort,dir}=UNIQ;
  let r=rows.filter(x=>(outcome==='all'||x.outcome===outcome) &&
    (!f || (x.url+x.method+x.code).toLowerCase().includes(f.toLowerCase())));
  r=r.sort((a,b)=>{let av=a[sort],bv=b[sort];if(sort==='last'){av=a.last;bv=b.last;}
    return (av>bv?1:av<bv?-1:0)*dir;});
  const pill=o=>`<span class="pill ${o}">${({block:'Blocked',through:'Through',cache:'Cache hit',other:'Other'})[o]||o}</span>`;
  const rowsHtml=r.slice(0,2000).map(x=>`<tr>
    <td>${esc(x.method)}</td>
    <td class="url" title="${esc(x.url)}">${esc(x.url)}</td>
    <td>${esc(x.code)}</td><td>${pill(x.outcome)}</td>
    <td>${x.count}</td><td>${fmtTime(x.last)}</td></tr>`).join('');
  $('#uniqBody').innerHTML=rowsHtml;
  $('#uniqCount').textContent=r.length+` / ${rows.length}`;
  const note=$('#uniqNote');
  if(note) note.textContent = r.length>2000
    ? '⚠ Showing first 2000 rows only — filter or sort to narrow results.'
    : '';
  $('#uniqSearch').oninput=e=>{UNIQ.f=e.target.value;renderUniq();};
  $('#uniqOut').onchange=e=>{UNIQ.outcome=e.target.value;renderUniq();};
}
/* ---------- DNS (dnsmasq log) ---------- */
const DNS_OK_TYPES=['A','AAAA','CNAME'];

function parseDns(text){
  // Syslog stamps carry no year and epoch time is not needed here: keep the
  // raw stamp for display, and the line index for ordering (dnsmasq logs are
  // chronological, so file order == time order).
  // prototype-less maps: a queried name like "constructor" must not hit
  // Object.prototype members.
  const rows=[],replies=Object.create(null),cached=Object.create(null);
  text.split(/\r?\n/).forEach(l=>{
    // optional hostname: matches both direct dnsmasq output and rsyslog format
    const mm=/^(\w{3}) +(\d+) ([\d:]{8})(?: \S+)? dnsmasq\[\d+\]: /.exec(l);
    if(!mm)return;
    const rest=l.slice(mm.index+mm[0].length);
    const q=/^query\[([A-Z]+)\] (\S+) from (\S+)/.exec(rest);
    if(q){rows.push({i:rows.length,int:isInternal(q[2]),stamp:mm[1]+' '+mm[2]+' '+mm[3],type:q[1],name:q[2],client:q[3],status:''});return;}
    const rp=/^reply (\S+) is (\S+)/.exec(rest);
    if(rp&&rp[1]!=='error')replies[rp[1]]=rp[2].startsWith('NODATA')?'nodata':rp[2];
    // "reply error is SERVFAIL" carries no name -> attribute to the newest
    // query still without a reply (sequential approximation).
    const er=/^reply error is (\S+)/.exec(rest);
    if(er){const last=rows[rows.length-1];if(last&&!last.status)last.status=er[1];}
    const ca=/^cached (\S+)/.exec(rest);
    if(ca)cached[ca[1]]='cached';
  });
  // r.status first: a sequential "reply error" attribution must not be
  // overwritten by an older same-name reply from replies/cached.
  rows.forEach(r=>{r.status=r.status||cached[r.name]||replies[r.name]||'';});
  return rows;
}

function ent(s){const m={};for(const c of s)m[c]=(m[c]||0)+1;
  let e=0;for(const k in m){const p=m[k]/s.length;e-=p*Math.log2(p);}return e;}
function dnsBase(n){return /\.(in-addr|ip6)\.arpa$/.test(n)?n:n.split('.').slice(-2).join('.');}
function isArpa(n){return /\.(in-addr|ip6)\.arpa$/.test(n);}
// Podman/container infra noise: reverse lookups and the internal container
// names (e.g. extagents-contained-proxy, contained-proxy). Kept in the raw
// table (behind a toggle) but excluded from all stats and anomaly detection.
function isInternal(n){return isArpa(n)||/(^|[._-])contained-proxy$/.test(n);}

/* Exfil/anomaly heuristics over query names (dnsmasq logs names verbatim,
   which is where DNS exfil payloads live). Returns deduped flags. */
function dnsAnomalies(rows){
  // NOTE: anomalies scan ALL rows (incl. "internal" names) on purpose, so
  // exfil can't hide behind a name ending in -contained-proxy; only stats
  // and the default table view filter those out. Arpa stays out of fan-out.
  const fan=Object.create(null);
  rows.forEach(r=>{if(!isArpa(r.name))
    (fan[dnsBase(r.name)]||(fan[dnsBase(r.name)]=new Set())).add(r.name);});
  const fanOut=Object.create(null);Object.entries(fan).forEach(([k,v])=>{if(v.size>20)fanOut[k]=v.size;});
  const out=[],seen=new Set();
  rows.forEach(r=>{
    const add=rule=>{const key=r.name+'|'+rule;
      if(!seen.has(key)){seen.add(key);out.push({...r,rule});}};
    const labels=r.name.replace(/\.$/,'').split('.');
    if(labels.some(x=>x.length>30))add('long label (>30)');
    // entropy + digit requirement: real exfil payloads are base64/base32/hex;
    // plain hostnames like "extagents-contained-proxy" must not fire.
    if(labels.some(x=>x.length>=16&&ent(x)>3.5&&/[0-9]/.test(x)&&/[a-z]/.test(x)))add('high-entropy label');
    if(!DNS_OK_TYPES.includes(r.type))add('rare type: '+r.type);
    const fb=dnsBase(r.name);  // fan-out is flagged once per base domain
    if(fanOut[fb]!==undefined){const key='fanout|'+fb;
      if(!seen.has(key)){seen.add(key);
        out.push({...r,rule:fanOut[fb]+' unique subdomains of '+fb});}}
    if(r.status==='NXDOMAIN'||r.status==='SERVFAIL')add(r.status);
  });
  return out.sort((a,b)=>b.i-a.i);
}

let DANOM={flags:[],hideLoc:true};
function isLocal(c){return c==='127.0.0.1'||c==='::1'||c==='localhost';}
function renderAnom(){
  const {flags,hideLoc}=DANOM;
  const r=flags.filter(x=>!hideLoc||!isLocal(x.client)).slice(0,200);
  // names the pods query about themselves (arpa / *contained-proxy) are
  // expected infra noise: keep them in the scan, but mark them green
  $('#anomBody').innerHTML=r.map(x=>`<tr>
    <td>${esc(x.stamp)}</td><td>${esc(x.client)}</td><td>${esc(x.type)}</td>
    <td class="url" title="${esc(x.name)}">${esc(x.name)}</td>
    <td><span class="pill block">${esc(x.rule)}</span>${isInternal(x.name)?' <span class="pill through">Expected</span>':''}</td></tr>`).join('')
    ||'<tr><td colspan="5" style="color:var(--muted)">'+(flags.length
      ?'All '+flags.length+' flagged requests are from localhost — tick "show localhost" to view'
      :'No anomalies detected')+'</td></tr>';
}

let DTBL={rows:[],f:'',type:'all',int:false};
function renderDnsTable(){
  const {rows,f,type,int}=DTBL;
  const r=rows.filter(x=>(type==='all'||x.type===type)&&!(!int&&x.int)&&
    (!f||(x.name+x.client).toLowerCase().includes(f.toLowerCase())))
    .sort((a,b)=>b.i-a.i);
  $('#dnsBody').innerHTML=r.slice(0,5000).map(x=>`<tr>
    <td>${esc(x.stamp)}</td><td>${esc(x.client)}</td><td>${esc(x.type)}</td>
    <td class="url" title="${esc(x.name)}">${esc(x.name)}</td>
    <td>${x.status==='NXDOMAIN'||x.status==='SERVFAIL'
        ?`<span class="pill block">${esc(x.status)}</span>`:esc(x.status||'-')}</td></tr>`).join('');
  $('#dnsCount').textContent=r.length+` / ${rows.length}`+(r.length>5000?' ⚠ first 5000 shown':'');
}

function renderDns(rows){
  const el=$('#dnsApp');
  if(!rows||!rows.length){el.innerHTML='';return;}
  const flags=dnsAnomalies(rows);
  const ext=rows.filter(r=>!r.int);
  const doms=Object.create(null),types=Object.create(null);
  ext.forEach(r=>{doms[dnsBase(r.name)]=(doms[dnsBase(r.name)]||0)+1;
    types[r.type]=(types[r.type]||0)+1;});
  const errs=rows.filter(r=>r.status==='NXDOMAIN'||r.status==='SERVFAIL').length;
  const top=Object.entries(doms).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const max=Math.max(1,...top.map(t=>t[1]));
  el.innerHTML=`
    <div class="c12" style="color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;font-size:.82rem">🌐 DNS activity (dnsmasq)</div>
    <div class="kpis">
      <div class="kpi"><div class="v">${rows.length}</div><div class="l">DNS queries</div></div>
      <div class="kpi"><div class="v">${ext.length}</div><div class="l">External queries</div></div>
      <div class="kpi"><div class="v">${Object.keys(doms).length}</div><div class="l">Domains queried</div></div>
      <div class="kpi"><div class="v">${Object.keys(types).length}</div><div class="l">Types: ${esc(Object.keys(types).join('/'))}</div></div>
      <div class="kpi"><div class="v">${errs}</div><div class="l">NXDOMAIN/SERVFAIL</div></div>
      <div class="kpi"><div class="v" style="color:${flags.length?'var(--block)':'var(--ok)'}">${flags.length}</div><div class="l">Anomalies / interesting DNS requests</div></div>
    </div>
    <div class="row">
      <div class="card" style="width:260px;flex-shrink:0"><h2>Top queried domains</h2><div id="dnsTop"></div></div>
      <div class="card" style="flex:1"><h2>🚩 Anomalies (possible exfil / errors / odd requests)</h2>
        <div class="controls">
          <label style="font-size:.8rem;color:var(--muted)"><input type="checkbox" id="dnsAnomLoc" style="width:auto;vertical-align:middle"> show localhost (127.0.0.1 / ::1) requests (${flags.filter(x=>isLocal(x.client)).length})</label>
        </div>
        <div class="tbl-wrap uniq-wrap"><table>
          <thead><tr><th>Time</th><th>Client</th><th>Type</th><th>Name</th><th>Flag</th></tr></thead>
          <tbody id="anomBody"></tbody>
        </table></div>
      </div>
    </div>
    <div class="card c12"><h2>DNS queries <span id="dnsCount" style="color:var(--muted);font-weight:400"></span></h2>
      <div class="controls">
        <input id="dnsSearch" placeholder="filter name / client…" style="min-width:240px">
        <select id="dnsType"><option value="all">All types</option>
          ${[...new Set(rows.map(r=>r.type))].sort().map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select>
        <label style="font-size:.8rem;color:var(--muted)"><input type="checkbox" id="dnsInt" style="width:auto;vertical-align:middle"> show internal requests by the pods (arpa / container names: ${rows.length-ext.length})</label>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Time</th><th>Client</th><th>Type</th><th>Name</th><th>Reply</th></tr></thead>
        <tbody id="dnsBody"></tbody></table></div>
    </div>`;
  // %-width bars so they fit the narrow card (px bars overflowed 260px).
  $('#dnsTop').innerHTML=top.map(([k,v])=>`<div style="margin:.25rem 0">
      <div style="font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(k)}</div>
      <div style="display:flex;height:14px;border-radius:4px;overflow:hidden;background:#0d1117">
        <div style="width:${v/max*100}%;background:var(--accent)"></div></div></div>`).join('')
    ||'<div style="color:var(--muted)">no domain data</div>';
  DANOM={flags,hideLoc:true};
  renderAnom();
  DTBL={rows,f:'',type:'all',int:false};
  renderDnsTable();
  $('#dnsSearch').oninput=e=>{DTBL.f=e.target.value;renderDnsTable();};
  $('#dnsType').onchange=e=>{DTBL.type=e.target.value;renderDnsTable();};
  $('#dnsInt').onchange=e=>{DTBL.int=e.target.checked;renderDnsTable();};
  $('#dnsAnomLoc').onchange=e=>{DANOM.hideLoc=!e.target.checked;renderAnom();};
}

function render(rows){
  $('#empty')?.remove();
  const k=kpis(rows);
  const app=$('#app');
  app.innerHTML=`
   <div class="kpis">
     <div class="kpi"><div class="v">${k.total}</div><div class="l">Requests</div></div>
     <div class="kpi"><div class="v" style="color:var(--ok)">${k.through}</div><div class="l">Went through</div></div>
     <div class="kpi"><div class="v" style="color:var(--block)">${k.block}</div><div class="l">Blocked</div></div>
     <div class="kpi"><div class="v" style="color:var(--cache)">${k.cache}</div><div class="l">Cache hits</div></div>
     <div class="kpi"><div class="v">${k.urls.size}</div><div class="l">Unique domains</div></div>
     <div class="kpi" title="Unique client IPs. Pod IPs change on container restarts, so the same pod counts as several clients."><div class="v">${k.clients.size}</div><div class="l">Clients (unique pod IPs)</div></div>
   </div>
    <div class="row">
      <div class="card" style="width:260px;flex-shrink:0"><h2>Top domains (allowed vs blocked)</h2><div id="topUrls"></div></div>
      <div class="card" style="flex:1">
        <div style="display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap">
          <h2>Unique requests <span id="uniqCount" style="color:var(--muted);font-weight:400"></span></h2>
          <div class="controls" style="margin:0 0 0 auto">
            <input id="uniqSearch" placeholder="filter url / method / code…" style="min-width:240px">
            <select id="uniqOut">
              <option value="all">All outcomes</option>
              <option value="block">Blocked</option>
              <option value="through">Through</option>
              <option value="cache">Cache hit</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div id="uniqCard"></div>
        <div id="uniqNote" style="color:var(--cache);font-size:.75rem;margin-top:.4rem;min-height:1rem"></div>
      </div>
    </div>
    <div class="card c12"><h2>Log explorer <span id="tblCount" style="color:var(--muted);font-weight:400"></span></h2>
     <div class="controls">
       <input id="search" placeholder="filter url / client / code…" style="min-width:240px">
       <select id="fOut">
         <option value="all">All outcomes</option>
         <option value="block">Blocked</option>
         <option value="through">Through</option>
         <option value="cache">Cache hit</option>
         <option value="other">Other</option>
       </select>
     </div>
      <div id="tableCard"></div>
      <div id="tblNote" style="color:var(--cache);font-size:.75rem;margin-top:.4rem;min-height:1rem"></div>
    </div>
    <footer>Parsed ${rows.length} lines · Squid native format · pure client-side, no server</footer>`;
  topUrls(rows,$('#topUrls'));
  buildTable(rows);
  $('#search').oninput=e=>{TBL.f=e.target.value;renderTable();};
  $('#fOut').onchange=e=>{TBL.outcome=e.target.value;renderTable();};
  buildUniq(rows);
}

/* ---------- load ---------- */
function doLoad(text,name,gen){
  if(gen!==dnsGen)return;  // stale response: a newer pod load has taken over
  try{
    const rows=parse(text);
    if(rows.length)render(rows);
    else alert('No parseable Squid log lines found in "'+name+'"\n\nExpected format:\ntimestamp duration client squid_code/http_code size method url user mime');
  }catch(err){console.error(err);alert('Failed to parse log: '+err.message);}
}
function loadURL(url,gen){
  fetch(url)
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status+' '+r.statusText);return r.text();})
    .then(t=>doLoad(t,url,gen))
    .catch(err=>{console.error('Failed to fetch log:',err);});
}
/* ---------- container discovery (when served over http(s)) ---------- */
const chooser=$('#chooser');
const containerSelect=$('#containerSelect');
let CONTAINERS=[];
let dnsGen=0;  // generation token: ignore stale squid/DNS fetches on fast pod switches

function loadContainer(c){
  const gen=++dnsGen;  // bump even when this pod has no DNS log, to avoid stale renders
  loadURL('/raw/' + encodeURIComponent(c.path), gen);
  // drop the previous pod's DNS panel; a newer gen guards against it being
  // re-rendered by a late-arriving stale fetch
  $('#dnsApp').innerHTML='';
  if(c.dns_path){
    fetch('/raw/' + encodeURIComponent(c.dns_path))
      .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
      .then(t=>{if(gen===dnsGen)renderDns(parseDns(t));})
      .catch(err=>console.error('DNS log load failed:',err));
  }
}

// When served over http(s) the server auto-discovers containers; hide the
// chooser when opened as file:// (discovery would hit a local path anyway).
if(location.protocol==='http:' || location.protocol==='https:'){
  fetch('/api/containers')
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(data=>{
      const list=(data && data.containers)||[];
      CONTAINERS=list;
      containerSelect.innerHTML='<option value="">— select a pod —</option>';
      list.forEach(c=>{
        const o=document.createElement('option');
        o.value=c.path;
        o.textContent=c.name + '  ·  ' + c.path;
        containerSelect.appendChild(o);
      });
      if(list.length===1){
        // exactly one container -> auto-load it
        containerSelect.value=list[0].path;
        loadContainer(list[0]);
      }
    })
    .catch(err=>{
      console.error('Container discovery failed:',err);
      containerSelect.innerHTML='<option value="">— containers unavailable —</option>';
    });
}else{
  chooser.style.display='none';
}

containerSelect.addEventListener('change',()=>{
  const c=CONTAINERS.find(x=>x.path===containerSelect.value);
  if(c) loadContainer(c);
});


</script>
</body>
</html>
